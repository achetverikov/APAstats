name: R-CMD-check

on:
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
      - "_pkgdown.yml"
      - ".github/workflows/pkgdown.yaml"
      - ".github/workflows/superb-parity.yaml"
      - ".github/scripts/superb-parity.R"
  pull_request:
    paths-ignore:
      - "README.md"
      - "_pkgdown.yml"
      - ".github/workflows/pkgdown.yaml"
      - ".github/workflows/superb-parity.yaml"
      - ".github/scripts/superb-parity.R"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-cmd-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      _R_CHECK_FORCE_SUGGESTS_: "false"
      _R_CHECK_DONTTEST_EXAMPLES_: "true"
      MAKEFLAGS: "-j1"
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::rcmdcheck, any::testthat, any::knitr, any::rmarkdown, any::brms, any::bayestestR, any::BH, any::RcppEigen, any::RcppParallel
          needs: check
      - name: Prepare Stan toolchain for the Bayesian example
        shell: Rscript {0}
        run: |
          # Binary rstan needs C++ headers at model-compilation time too.
          stopifnot(file.exists(system.file("include", "boost", "version.hpp",
                                           package = "BH")))
          # rstan 2.32.7 does not compile models with StanHeaders 2.39.x.
          if (packageVersion("rstan") == "2.32.7") {
            install.packages(
              "https://cloud.r-project.org/src/contrib/Archive/StanHeaders/StanHeaders_2.32.10.tar.gz",
              repos = NULL, type = "source"
            )
            stopifnot(packageVersion("StanHeaders") == "2.32.10")
          }
          message("rstan ", packageVersion("rstan"),
                  "; StanHeaders ", packageVersion("StanHeaders"))
      - name: Check
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran"),
            error_on = "warning",
            check_dir = "check"
          )
