name: R-CMD-check

on:
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
      - "_pkgdown.yml"
      - ".github/workflows/pkgdown.yaml"
      - ".github/workflows/superb-parity.yaml"
      - ".github/scripts/superb-parity.R"
  pull_request:
    paths-ignore:
      - "README.md"
      - "_pkgdown.yml"
      - ".github/workflows/pkgdown.yaml"
      - ".github/workflows/superb-parity.yaml"
      - ".github/scripts/superb-parity.R"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-cmd-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      _R_CHECK_FORCE_SUGGESTS_: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::rcmdcheck, any::testthat, any::knitr, any::rmarkdown
          needs: check
      - name: Check
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran"),
            error_on = "warning",
            check_dir = "check"
          )
