name: superb parity (manual)

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/superb-parity.yaml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cleanup-obsolete-history:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const obsolete = [375521376, 375718257, 375718417];
            for (const workflow_id of obsolete) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                { owner, repo, workflow_id, per_page: 100 }
              );
              for (const run of runs) {
                core.info(`Deleting run ${run.id} from workflow ${workflow_id}`);
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
              }
            }

  superb-parity:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::callr, any::remotes, any::reshape2

      - name: Install superb baseline
        shell: Rscript {0}
        run: |
          remotes::install_github(
            "achetverikov/superb@fix-ddply-function-lookup",
            dependencies = NA,
            upgrade = "never"
          )

      - name: Install old and current apastats2
        shell: bash
        run: |
          mkdir -p /tmp/apastats-old /tmp/apastats-new
          Rscript -e 'remotes::install_github("achetverikov/APAstats@d7acabc0fc082200dfe1770606dd71491e157ad5", lib="/tmp/apastats-old", dependencies=FALSE, upgrade="never")'
          R CMD INSTALL . --library=/tmp/apastats-new

      - name: Compare against superb implementation
        shell: bash
        run: |
          Rscript .github/scripts/superb-parity.R /tmp/apastats-old /tmp/apastats-new
