name: Publish v1.0.4 release

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/publish-v1.0.4.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = "v1.0.4";
            const target = "6d03f2b2f3f52d266947bd4eec60c1805f1ce1ec";
            const body = [
              "## apastats2 1.0.4",
              "",
              "- Added the `memory_noise` example dataset derived from Chetverikov & Hansmann-Roth (2026), with Exp. 1 vs. Exp. 1 HV as the between-subject factor and target relative noise as the within-subject factor.",
              "- Removed the legacy `faces` example dataset; maintained examples now use `memory_noise` or built-in datasets.",
              "- Added `get_adjusted_ci()` as the general interval engine for between-subject, within-subject, and mixed designs; `plot_pointrange()` now uses it throughout.",
              "- Reimplemented Cousineau-Morey intervals internally, removing the `superb`/`reshape2` dependency while documenting the implementation's basis in the superb framework.",
              "- Added arbitrary scalar summary-function support and custom precision hooks to `get_adjusted_ci()`; `get_superb_ci()` remains as a deprecated compatibility wrapper.",
              "- Added `apa()` support for `aov()` models with `Error()` terms (`aovlist`) and for `afex` ANOVA objects.",
              "- Added compatibility and CRAN-readiness fixes, including direct parity checks against the previous superb-backed implementation.",
              "",
              "Validation: R CMD check --as-cran passed with no errors or warnings (apart from the expected new-submission NOTE), and superb parity checks passed."
            ].join("\n");

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release ${tag} already exists; leaving it unchanged.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              const result = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: target,
                name: "apastats2 1.0.4",
                body,
                draft: false,
                prerelease: false
              });
              core.info(`Created release: ${result.data.html_url}`);
            }
